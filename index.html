<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App - Full P2P & Quiz Maker</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Comic Sans MS, "Chalkboard SE", "Comic Neue", sans-serif, Arial;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: absolute;
            top: 0;
            left: 0;
            overflow-y: auto;
            padding-bottom: 40px;
        }

        .screen.active {
            display: flex;
        }

        /* AUTH SCREEN */
        #auth-screen {
            justify-content: center;
            background-color: #f0f4f8;
        }

        .auth-card {
            background: #fff;
            border: 3px solid #000;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 4px 4px 0px #000;
        }

        /* MAIN MENU */
        #main-menu {
            padding-top: 20px;
            background-color: #ffffff;
        }

        .search-bar {
            background-color: #c0f1f7;
            border: 2px solid #000;
            border-radius: 25px;
            padding: 8px 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            cursor: pointer;
            width: 280px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .search-icon {
            width: 24px;
            height: 24px;
        }

        .ticker-container {
            width: 85%;
            max-width: 900px;
            background-color: #bbedf9;
            border: 2px solid #000;
            border-radius: 30px;
            padding: 10px 20px;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 25px;
        }

        .ticker-text {
            display: inline-block;
            font-size: 20px;
            animation: marquee 15s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 25px;
            width: 85%;
            max-width: 850px;
        }

        .menu-btn {
            border: 2px solid #000;
            border-radius: 20px;
            padding: 22px 15px;
            font-size: 26px;
            cursor: pointer;
            text-align: center;
            outline: none;
            transition: transform 0.15s ease-in-out;
            user-select: none;
        }

        .menu-btn:active, .interactive-btn:active {
            transform: scale(1.12) !important;
        }

        .btn-blue { background-color: #38cbf7; color: #000; }
        .btn-green { background-color: #b7e362; color: #000; }
        .btn-pink { background-color: #ff52a9; color: #000; }
        .btn-purple { background-color: #a54bfd; color: #fff; }
        .btn-orange { background-color: #ff9d3b; color: #000; }

        .input-box {
            font-size: 18px;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #000;
            width: 100%;
            margin-bottom: 12px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #eee;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 18px;
            z-index: 10;
        }

        .user-nav {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .option-btn {
            width: 90%;
            max-width: 400px;
            padding: 15px;
            margin: 8px 0;
            border: 2px solid #000;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            background-color: #eef;
            transition: transform 0.15s ease;
        }

        .quiz-card {
            border: 2px solid #000;
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            width: 90%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
        }

        .q-block {
            background: #f0f8ff;
            border: 2px dashed #000;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="screen active">
        <div class="auth-card">
            <h2>Welcome to Quiz MMS</h2>
            <input type="email" id="auth-email" class="input-box" placeholder="Email">
            <input type="password" id="auth-pass" class="input-box" placeholder="Password">
            <input type="text" id="auth-username" class="input-box" placeholder="Username (Display Name)">
            <button class="interactive-btn menu-btn btn-green" style="padding: 10px 30px; font-size: 20px; width: 100%;" id="btn-login">Login</button>
            <button class="interactive-btn menu-btn btn-blue" style="padding: 10px 30px; font-size: 20px; width: 100%; margin-top: 10px;" id="btn-register">Register</button>
        </div>
    </div>

    <!-- MAIN MENU SCREEN -->
    <div id="main-menu" class="screen">
        <div class="user-nav">
            <span id="user-display" style="font-weight: bold;"></span>
            <button class="interactive-btn" id="btn-logout" style="border: 2px solid #000; border-radius: 8px; padding: 5px 10px; cursor: pointer;">Logout</button>
        </div>

        <div class="search-bar interactive-btn" id="btn-open-search">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Search</span>
        </div>

        <div class="ticker-container">
            <div class="ticker-text">
                Hi, <span id="db-username">Player</span>! | P2P Network: <span id="peer-status">Offline</span>
            </div>
        </div>

        <div class="button-grid">
            <button class="menu-btn btn-blue" id="btn-open-host">Host Quiz</button>
            <button class="menu-btn btn-orange" id="btn-open-join">Join Room</button>
            <button class="menu-btn btn-pink" id="btn-open-create">Quiz Maker</button>
            <button class="menu-btn btn-purple" id="btn-open-browse">Browse Quizzes</button>
        </div>
    </div>

    <!-- QUIZ MAKER SCREEN -->
    <div id="create-screen" class="screen">
        <button class="back-btn screen-nav" data-target="main-menu">← Back</button>
        <h2 style="margin-top: 60px;">Quiz Maker</h2>
        <div style="width: 90%; max-width: 500px;">
            <input type="text" id="maker-quiz-title" class="input-box" placeholder="Quiz Title">
            <div id="questions-container"></div>
            <button class="interactive-btn menu-btn btn-blue" id="btn-add-question" style="padding: 10px; font-size: 18px; width: 100%; margin-bottom: 10px;">+ Add Question</button>
            <button class="interactive-btn menu-btn btn-green" id="btn-publish-quiz" style="padding: 12px; font-size: 22px; width: 100%;">Publish to Database</button>
        </div>
    </div>

    <!-- SEARCH & BROWSE SCREEN -->
    <div id="search-screen" class="screen">
        <button class="back-btn screen-nav" data-target="main-menu">← Back</button>
        <h2 style="margin-top: 60px;">Search Quizzes</h2>
        <input type="text" id="search-input" class="input-box" style="max-width: 400px;" placeholder="Search quizzes...">
        <div id="quiz-list" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <!-- HOST ROOM SCREEN -->
    <div id="host-screen" class="screen">
        <button class="back-btn screen-nav" data-target="main-menu">← Back</button>
        <h2 style="margin-top: 60px;">Host P2P Room</h2>
        <h3>Room Code: <span id="room-code-display" style="color: #a54bfd;">---</span></h3>
        <p id="host-status-text">Select a quiz to host for connected peers:</p>
        <div id="host-quiz-select" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <!-- JOIN ROOM SCREEN -->
    <div id="join-screen" class="screen">
        <button class="back-btn screen-nav" data-target="main-menu">← Back</button>
        <h2 style="margin-top: 60px;">Join Room</h2>
        <div style="width: 90%; max-width: 400px;">
            <input type="text" id="join-code-input" class="input-box" placeholder="Enter 6-Digit Code">
            <button class="interactive-btn menu-btn btn-green" id="btn-connect-room" style="padding: 10px; font-size: 20px; width: 100%;">Connect P2P</button>
        </div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="game-screen" class="screen">
        <button class="back-btn screen-nav" data-target="main-menu">Quit</button>
        <h2 id="game-title" style="margin-top: 60px;">Live Quiz</h2>
        <h3 id="question-text" style="font-size: 24px; text-align: center; max-width: 80%;">Waiting for host...</h3>
        <div id="options-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdA4NrS1Z57dqGoROuN9N-Lafhm-j-rJI",
            authDomain: "quizmms-8f1bb.firebaseapp.com",
            projectId: "quizmms-8f1bb",
            storageBucket: "quizmms-8f1bb.firebasestorage.app",
            messagingSenderId: "329178974454",
            appId: "1:329178974454:web:1a5e8470165cd6c3fa44d7",
            measurementId: "G-Z54PW8WS4C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
        let peerConnection = null;
        let dataChannel = null;
        let currentUser = null;
        let currentRoomId = null;
        let questionCount = 0;
        let activeQuizData = null;
        let currentQIndex = 0;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        document.querySelectorAll('.screen-nav').forEach(btn => {
            btn.addEventListener('click', (e) => showScreen(e.target.dataset.target));
        });

        // AUTHENTICATION
        document.getElementById('btn-register').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const username = document.getElementById('auth-username').value;
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(userCred.user, { displayName: username });
            } catch (err) { alert(err.message); }
        });

        document.getElementById('btn-login').addEventListener('click', async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-pass').value);
            } catch (err) { alert(err.message); }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('db-username').innerText = user.displayName || user.email;
                document.getElementById('user-display').innerText = `@${user.displayName || 'User'}`;
                showScreen('main-menu');
            } else {
                currentUser = null;
                showScreen('auth-screen');
            }
        });

        // QUIZ MAKER ENGINE
        function addQuestionBlock() {
            questionCount++;
            const container = document.getElementById('questions-container');
            const div = document.createElement('div');
            div.className = 'q-block';
            div.id = `q-block-${questionCount}`;
            div.innerHTML = `
                <h4>Question ${questionCount}</h4>
                <input type="text" class="input-box q-text" placeholder="Question Text">
                <input type="text" class="input-box q-opt0" placeholder="Option 1 (Correct Answer)">
                <input type="text" class="input-box q-opt1" placeholder="Option 2">
                <input type="text" class="input-box q-opt2" placeholder="Option 3">
            `;
            container.appendChild(div);
        }

        document.getElementById('btn-open-create').addEventListener('click', () => {
            document.getElementById('questions-container').innerHTML = "";
            questionCount = 0;
            addQuestionBlock();
            showScreen('create-screen');
        });

        document.getElementById('btn-add-question').addEventListener('click', addQuestionBlock);

        document.getElementById('btn-publish-quiz').addEventListener('click', async () => {
            const title = document.getElementById('maker-quiz-title').value.trim();
            if (!title) return alert("Please enter a title.");

            const questions = [];
            for (let i = 1; i <= questionCount; i++) {
                const block = document.getElementById(`q-block-${i}`);
                if (block) {
                    const qText = block.querySelector('.q-text').value;
                    const opt0 = block.querySelector('.q-opt0').value;
                    const opt1 = block.querySelector('.q-opt1').value;
                    const opt2 = block.querySelector('.q-opt2').value;

                    if (qText && opt0 && opt1 && opt2) {
                        questions.push({
                            q: qText,
                            options: [opt0, opt1, opt2],
                            correct: 0
                        });
                    }
                }
            }

            if (questions.length === 0) return alert("Add at least one complete question.");

            const quizRef = push(ref(db, 'quizzes'));
            await set(quizRef, {
                title: title,
                creator: currentUser.displayName || currentUser.email,
                questions: questions
            });

            alert("Quiz published successfully!");
            showScreen('main-menu');
        });

        // BROWSE & SEARCH QUIZZES
        document.getElementById('btn-open-browse').addEventListener('click', loadQuizzes);
        document.getElementById('btn-open-search').addEventListener('click', loadQuizzes);

        async function loadQuizzes() {
            showScreen('search-screen');
            const snap = await get(ref(db, 'quizzes'));
            const listContainer = document.getElementById('quiz-list');
            listContainer.innerHTML = "";

            if (snap.exists()) {
                const data = snap.val();
                Object.keys(data).forEach(key => {
                    const quiz = data[key];
                    const card = document.createElement('div');
                    card.className = 'quiz-card';
                    card.innerHTML = `
                        <div>
                            <strong>${quiz.title}</strong><br>
                            <small>By: ${quiz.creator}</small>
                        </div>
                        <button class="interactive-btn" style="background:#b7e362; border:2px solid #000; border-radius:8px; padding:6px 14px; cursor:pointer;">Play</button>
                    `;
                    card.querySelector('button').onclick = () => playQuizLocal(quiz);
                    listContainer.appendChild(card);
                });
            }
        }

        function playQuizLocal(quiz) {
            activeQuizData = quiz;
            currentQIndex = 0;
            showScreen('game-screen');
            document.getElementById('game-title').innerText = quiz.title;
            renderQuestion();
        }

        function renderQuestion() {
            const q = activeQuizData.questions[currentQIndex];
            document.getElementById('question-text').innerText = q.q;
            const container = document.getElementById('options-container');
            container.innerHTML = "";

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn interactive-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    if (idx === q.correct) alert("Correct!");
                    else alert("Wrong!");

                    currentQIndex++;
                    if (currentQIndex < activeQuizData.questions.length) {
                        renderQuestion();
                    } else {
                        alert("Quiz Finished!");
                        showScreen('main-menu');
                    }
                };
                container.appendChild(btn);
            });
        }

        // WEBRTC HOSTING & JOINING
        document.getElementById('btn-open-host').addEventListener('click', async () => {
            showScreen('host-screen');
            currentRoomId = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('room-code-display').innerText = currentRoomId;

            peerConnection = new RTCPeerConnection(rtcConfig);
            dataChannel = peerConnection.createDataChannel("quizChannel");
            setupDataChannel(dataChannel);

            const roomRef = ref(db, `rooms/${currentRoomId}`);
            peerConnection.onicecandidate = (e) => {
                if (e.candidate) push(ref(db, `rooms/${currentRoomId}/offerCandidates`), e.candidate.toJSON());
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            await set(roomRef, { offer: { type: offer.type, sdp: offer.sdp } });

            onValue(ref(db, `rooms/${currentRoomId}/answer`), async (snap) => {
                const data = snap.val();
                if (data && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                }
            });

            onValue(ref(db, `rooms/${currentRoomId}/answerCandidates`), (snap) => {
                snap.forEach(c => peerConnection.addIceCandidate(new RTCIceCandidate(c.val())));
            });

            // Populate Host Quiz List
            const snap = await get(ref(db, 'quizzes'));
            const container = document.getElementById('host-quiz-select');
            container.innerHTML = "";
            if (snap.exists()) {
                Object.values(snap.val()).forEach(quiz => {
                    const btn = document.createElement('button');
                    btn.className = 'interactive-btn menu-btn btn-green';
                    btn.style.cssText = "padding:10px; font-size:18px; margin:5px; width:90%; max-width:400px;";
                    btn.innerText = `Host: ${quiz.title}`;
                    btn.onclick = () => {
                        if (dataChannel && dataChannel.readyState === 'open') {
                            dataChannel.send(JSON.stringify({ type: 'HOST_QUIZ', quiz: quiz }));
                            playQuizLocal(quiz);
                        } else {
                            alert("Wait for peer to connect first!");
                        }
                    };
                    container.appendChild(btn);
                });
            }
        });

        document.getElementById('btn-open-join').addEventListener('click', () => showScreen('join-screen'));

        document.getElementById('btn-connect-room').addEventListener('click', async () => {
            const code = document.getElementById('join-code-input').value.trim();
            if (!code) return alert("Enter code.");

            currentRoomId = code;
            const roomSnap = await get(ref(db, `rooms/${code}`));
            if (!roomSnap.exists()) return alert("Room not found.");

            peerConnection = new RTCPeerConnection(rtcConfig);
            peerConnection.ondatachannel = (e) => setupDataChannel(e.channel);

            peerConnection.onicecandidate = (e) => {
                if (e.candidate) push(ref(db, `rooms/${code}/answerCandidates`), e.candidate.toJSON());
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(roomSnap.val().offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            await set(ref(db, `rooms/${code}/answer`), { type: answer.type, sdp: answer.sdp });

            onValue(ref(db, `rooms/${code}/offerCandidates`), (snap) => {
                snap.forEach(c => peerConnection.addIceCandidate(new RTCIceCandidate(c.val())));
            });
        });

        function setupDataChannel(channel) {
            dataChannel = channel;
            dataChannel.onopen = () => {
                document.getElementById('peer-status').innerText = "Connected (P2P)";
            };
            dataChannel.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'HOST_QUIZ') {
                    playQuizLocal(msg.quiz);
                }
            };
        }
    </script>
</body>
</html>
