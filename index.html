<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App - WebRTC & Firebase</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Comic Sans MS, "Chalkboard SE", "Comic Neue", sans-serif, Arial;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: absolute;
            top: 0;
            left: 0;
            overflow-y: auto;
            padding-bottom: 40px;
        }

        .screen.active {
            display: flex;
        }

        /* AUTH SCREEN */
        #auth-screen {
            justify-content: center;
            background-color: #f0f4f8;
        }

        .auth-card {
            background: #fff;
            border: 3px solid #000;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 4px 4px 0px #000;
        }

        /* MAIN MENU */
        #main-menu {
            padding-top: 20px;
            background-color: #ffffff;
        }

        .search-bar {
            background-color: #c0f1f7;
            border: 2px solid #000;
            border-radius: 25px;
            padding: 8px 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            cursor: pointer;
            width: 280px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .search-icon {
            width: 24px;
            height: 24px;
        }

        .ticker-container {
            width: 85%;
            max-width: 900px;
            background-color: #bbedf9;
            border: 2px solid #000;
            border-radius: 30px;
            padding: 10px 20px;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 30px;
        }

        .ticker-text {
            display: inline-block;
            font-size: 20px;
            animation: marquee 15s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 25px;
            width: 85%;
            max-width: 850px;
        }

        .menu-btn {
            border: 2px solid #000;
            border-radius: 20px;
            padding: 25px 15px;
            font-size: 28px;
            cursor: pointer;
            text-align: center;
            outline: none;
            transition: transform 0.15s ease-in-out;
            user-select: none;
        }

        .menu-btn:active, .interactive-btn:active {
            transform: scale(1.15) !important;
        }

        .btn-blue { background-color: #38cbf7; color: #000; }
        .btn-green { background-color: #b7e362; color: #000; }
        .btn-pink { background-color: #ff52a9; color: #000; }
        .btn-purple { background-color: #a54bfd; color: #fff; }
        .btn-orange { background-color: #ff9d3b; color: #000; }

        .input-box {
            font-size: 18px;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #000;
            width: 100%;
            margin-bottom: 15px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #eee;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 18px;
            z-index: 10;
        }

        .user-nav {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .option-btn {
            width: 90%;
            max-width: 400px;
            padding: 15px;
            margin: 8px 0;
            border: 2px solid #000;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            background-color: #eef;
            transition: transform 0.15s ease;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="screen active">
        <div class="auth-card">
            <h2>Welcome to Quiz MMS</h2>
            <input type="email" id="auth-email" class="input-box" placeholder="Email">
            <input type="password" id="auth-pass" class="input-box" placeholder="Password">
            <input type="text" id="auth-username" class="input-box" placeholder="Username (Display Name)">
            <button class="interactive-btn menu-btn btn-green" style="padding: 10px 30px; font-size: 20px; width: 100%;" id="btn-login">Login</button>
            <button class="interactive-btn menu-btn btn-blue" style="padding: 10px 30px; font-size: 20px; width: 100%; margin-top: 10px;" id="btn-register">Register</button>
        </div>
    </div>

    <!-- MAIN MENU SCREEN -->
    <div id="main-menu" class="screen">
        <div class="user-nav">
            <span id="user-display" style="font-weight: bold;"></span>
            <button class="interactive-btn" id="btn-logout" style="border: 2px solid #000; border-radius: 8px; padding: 5px 10px; cursor: pointer;">Logout</button>
        </div>

        <div class="search-bar interactive-btn">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Search</span>
        </div>

        <div class="ticker-container">
            <div class="ticker-text">
                Hi, <span id="db-username">Player</span>! | Connection Status: <span id="peer-status">Offline</span>
            </div>
        </div>

        <div class="button-grid">
            <button class="menu-btn btn-blue" id="btn-open-host">Host Quiz</button>
            <button class="menu-btn btn-orange" id="btn-open-join">Join Room</button>
            <button class="menu-btn btn-pink" id="btn-open-create">Create Quiz</button>
            <button class="menu-btn btn-purple" id="btn-open-play">Play Local</button>
        </div>
    </div>

    <!-- HOST ROOM SCREEN -->
    <div id="host-screen" class="screen">
        <button class="back-btn screen-nav" data-target="main-menu">← Back</button>
        <h2 style="margin-top: 60px;">Hosting Room</h2>
        <h3>Room Code: <span id="room-code-display" style="color: #a54bfd;">---</span></h3>
        <p>Waiting for a peer to join via WebRTC...</p>
        <button class="interactive-btn menu-btn btn-green" id="btn-start-p2p-game" style="display:none; padding: 10px 20px; font-size: 20px;">Start P2P Quiz</button>
    </div>

    <!-- JOIN ROOM SCREEN -->
    <div id="join-screen" class="screen">
        <button class="back-btn screen-nav" data-target="main-menu">← Back</button>
        <h2 style="margin-top: 60px;">Join P2P Room</h2>
        <div style="width: 90%; max-width: 400px;">
            <input type="text" id="join-code-input" class="input-box" placeholder="Enter 6-Digit Room Code">
            <button class="interactive-btn menu-btn btn-green" id="btn-connect-room" style="padding: 10px; font-size: 20px; width: 100%;">Connect to Host</button>
        </div>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="game-screen" class="screen">
        <button class="back-btn screen-nav" data-target="main-menu">Quit</button>
        <h2 id="game-title" style="margin-top: 60px;">Live P2P Quiz</h2>
        <h3 id="question-text" style="font-size: 24px; text-align: center; max-width: 80%;">Waiting for question...</h3>
        <div id="options-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <!-- FIREBASE MODULE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, get, child } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdA4NrS1Z57dqGoROuN9N-Lafhm-j-rJI",
            authDomain: "quizmms-8f1bb.firebaseapp.com",
            projectId: "quizmms-8f1bb",
            storageBucket: "quizmms-8f1bb.firebasestorage.app",
            messagingSenderId: "329178974454",
            appId: "1:329178974454:web:1a5e8470165cd6c3fa44d7",
            measurementId: "G-Z54PW8WS4C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // RTC Configuration for direct P2P connections
        const rtcConfig = {
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        };

        let peerConnection = null;
        let dataChannel = null;
        let currentUser = null;
        let currentRoomId = null;

        // UI Navigation Utility
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        document.querySelectorAll('.screen-nav').forEach(btn => {
            btn.addEventListener('click', (e) => showScreen(e.target.dataset.target));
        });

        // 1. AUTHENTICATION LOGIC
        document.getElementById('btn-register').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const username = document.getElementById('auth-username').value;

            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(userCred.user, { displayName: username });
                alert("Account created successfully!");
            } catch (err) {
                alert("Auth Error: " + err.message);
            }
        });

        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;

            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                alert("Login Error: " + err.message);
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('db-username').innerText = user.displayName || user.email;
                document.getElementById('user-display').innerText = `@${user.displayName || 'User'}`;
                showScreen('main-menu');
            } else {
                currentUser = null;
                showScreen('auth-screen');
            }
        });

        // 2. WEBRTC P2P SIGNALING VIA FIREBASE REALTIME DATABASE
        
        // HOSTING A ROOM
        document.getElementById('btn-open-host').addEventListener('click', async () => {
            showScreen('host-screen');
            currentRoomId = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('room-code-display').innerText = currentRoomId;

            peerConnection = new RTCPeerConnection(rtcConfig);
            
            // Create data channel for high-speed P2P messages
            dataChannel = peerConnection.createDataChannel("quizChannel");
            setupDataChannelEvents(dataChannel);

            const roomRef = ref(db, `rooms/${currentRoomId}`);
            const offerCandidatesRef = ref(db, `rooms/${currentRoomId}/offerCandidates`);
            const answerCandidatesRef = ref(db, `rooms/${currentRoomId}/answerCandidates`);

            // Listen for ICE Candidates locally and send to Firebase
            peerConnection.onicecandidate = (e) => {
                if (e.candidate) push(offerCandidatesRef, e.candidate.toJSON());
            };

            // Create Offer
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            await set(roomRef, {
                offer: { type: offer.type, sdp: offer.sdp },
                host: currentUser.displayName || currentUser.email
            });

            // Listen for Remote Answer
            onValue(ref(db, `rooms/${currentRoomId}/answer`), async (snapshot) => {
                const data = snapshot.val();
                if (data && !peerConnection.currentRemoteDescription) {
                    const rtcDesc = new RTCSessionDescription(data);
                    await peerConnection.setRemoteDescription(rtcDesc);
                }
            });

            // Listen for Remote ICE Candidates
            onValue(answerCandidatesRef, (snapshot) => {
                snapshot.forEach((childSnapshot) => {
                    const candidate = new RTCIceCandidate(childSnapshot.val());
                    peerConnection.addIceCandidate(candidate);
                });
            });
        });

        // JOINING A ROOM
        document.getElementById('btn-open-join').addEventListener('click', () => showScreen('join-screen'));

        document.getElementById('btn-connect-room').addEventListener('click', async () => {
            const roomCode = document.getElementById('join-code-input').value.trim();
            if (!roomCode) return alert("Enter a valid code.");

            currentRoomId = roomCode;
            const roomRef = ref(db, `rooms/${roomCode}`);
            const roomSnap = await get(roomRef);

            if (!roomSnap.exists()) return alert("Room not found!");

            peerConnection = new RTCPeerConnection(rtcConfig);

            peerConnection.ondatachannel = (e) => {
                dataChannel = e.channel;
                setupDataChannelEvents(dataChannel);
            };

            const offerCandidatesRef = ref(db, `rooms/${roomCode}/offerCandidates`);
            const answerCandidatesRef = ref(db, `rooms/${roomCode}/answerCandidates`);

            peerConnection.onicecandidate = (e) => {
                if (e.candidate) push(answerCandidatesRef, e.candidate.toJSON());
            };

            const roomData = roomSnap.val();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(roomData.offer));

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            await set(ref(db, `rooms/${roomCode}/answer`), {
                type: answer.type,
                sdp: answer.sdp
            });

            onValue(offerCandidatesRef, (snapshot) => {
                snapshot.forEach((childSnapshot) => {
                    const candidate = new RTCIceCandidate(childSnapshot.val());
                    peerConnection.addIceCandidate(candidate);
                });
            });
        });

        // 3. P2P DATA CHANNEL COMMUNICATION
        function setupDataChannelEvents(channel) {
            channel.onopen = () => {
                document.getElementById('peer-status').innerText = "Connected (P2P)";
                if (document.getElementById('host-screen').classList.contains('active')) {
                    document.getElementById('btn-start-p2p-game').style.display = "inline-block";
                }
            };

            channel.onmessage = (event) => {
                const message = JSON.parse(event.data);
                if (message.type === 'START_QUIZ') {
                    showScreen('game-screen');
                    displayP2PQuestion(message.data);
                }
            };

            channel.onclose = () => {
                document.getElementById('peer-status').innerText = "Disconnected";
            };
        }

        // Host sends quiz payload directly over WebRTC Data Channel
        document.getElementById('btn-start-p2p-game').addEventListener('click', () => {
            if (dataChannel && dataChannel.readyState === 'open') {
                const payload = {
                    type: 'START_QUIZ',
                    data: {
                        q: "P2P Test: What protocol handles real-time peer data?",
                        options: ["HTTP", "WebRTC", "FTP", "SMTP"],
                        correct: 1
                    }
                };
                dataChannel.send(JSON.stringify(payload));
                showScreen('game-screen');
                displayP2PQuestion(payload.data);
            }
        });

        function displayP2PQuestion(qData) {
            document.getElementById('question-text').innerText = qData.q;
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn interactive-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    if (idx === qData.correct) alert("Correct!");
                    else alert("Wrong!");
                };
                container.appendChild(btn);
            });
        }
    </script>
</body>
</html>
